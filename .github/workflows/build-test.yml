name: .NET Core Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore Ledgr.sln
      
    - name: Build Solution
      run: dotnet build Ledgr.sln --no-restore --configuration Release
      
    - name: Run xUnit Test Suite
      run: dotnet test Ledgr.Tests/Ledgr.Tests.csproj --no-build --configuration Release --verbosity normal


name: Bug Report
description: Create a report to help us improve Ledgr
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much context as possible.
  - type: input
    id: version
    attributes:
      label: Ledgr Version / Commit SHA
      description: What version or commit of Ledgr are you running?
      placeholder: e.g., v0.2.0 or 9938ead
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. POST /api/Orders with item quantity exceeding stock
        2. Inspect response status code
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true


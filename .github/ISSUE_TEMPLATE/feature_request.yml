name: Feature Request
description: Suggest an idea or architectural improvement for Ledgr
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please outline your proposal, target persona, and expected benefits.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Describe any alternative solutions or workarounds you've considered.
